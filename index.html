<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Dicee</title>
    <link rel="stylesheet" href="styles.css" />
    <link

    />

<body>
  
<div class="form">
          <h1>Enter the name of the players</h1>
            
        <form  action="#" >
            <div class="player">
              <label  for="player1">
                Enter player 1 name:
              <input type="text" id="player1" placeholder="enter the player one name">
                
              </label>
            </div>
            <div class="player">
              <label for="player2">
                Enter player 2 name:
                <input type="text"  id="player2" placeholder="enter the player two name">
                
              </label>
          
            </div>
            <button type="submit">Submit</button>
        </form>
        </div> 
          
            
          
  <div class="d ">
          <h1>Roll the die</h1>
          <p class="opa">Roll the die players</p>
          <div class="container">
            <div class="p">
              <p class="pone">player 1</p>
              <div class="dice one">
                <img class="img1" src="images/dice6.png" />
              </div>
            </div>
            <div class="p">
              <p class="ptwo">player 2</p>
              <div class="dice two">
                <img class="img2" src="images/dice6.png" />
              </div>
            </div>
          </div>
          <p class="score">score</p>
          <button class="toss">Roll</button>
  </div>

</body>
